<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCSR Ranked Overlay</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  html { font-size: calc(16px * var(--scale, 1));
    --sp-pad: 1rem; --sp-sec: .875rem; --sp-in: .75rem; --sp-bar: 1.25rem; }
  html, body { margin: 0; padding: 0; background: transparent; }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh; padding: 10px; overflow: hidden;
    display: flex; flex-direction: column; align-items: flex-start;
    font: 500 .8125rem/1.3 var(--font, 'Segoe UI'), system-ui, sans-serif;
    font-variant-numeric: tabular-nums; font-variant-ligatures: none; letter-spacing: -.005em;
    color: var(--text); -webkit-font-smoothing: antialiased;
  }
  /* sized by its content, so the size reported to the customizer is the real one */
  #root { flex: none; width: max-content; }
  /* the same overlay mid-run, laid out but never shown, so the customizer can size the source for it */
  #ghost { position: absolute; left: 0; top: 0; width: max-content; padding: 10px; visibility: hidden; pointer-events: none; }
  body.a-center { align-items: center; }
  body.a-right { align-items: flex-end; }
  body.v-bottom { justify-content: flex-end; }
  body.tshadow .ov { text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  body.st-tooltip.tshadow .ov { text-shadow: .09rem .09rem 0 rgba(0,0,0,.5); }

  .ov { position: relative; flex: none; overflow: hidden; border-radius: var(--radius);
    background-color: var(--bg); background-image: var(--tex, none), var(--fill, none); background-size: var(--tex-size, auto), 100% 100%; }
  .ov.bordered { box-shadow: inset 0 0 0 1px var(--line); }
  .ov.shadowed { box-shadow: 0 8px 24px rgba(0,0,0,.28); }
  .ov.bordered.shadowed { box-shadow: inset 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,.28); }

  .pos { color: var(--win); } .neg { color: var(--loss); } .zero { color: var(--muted); }
  .muted { color: var(--muted); }
  .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* MCSR Ranked's own rank badges: a 6×3 sprite of 15px icons */
  .rk { display: inline-block; flex: none; width: var(--rk); height: var(--rk); vertical-align: middle;
    background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFoAAAAtCAMAAAAZUYxJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAACxUExURZuwsqjEtiQuNYCPmS0/Pll3bmdyf4CZkhsZK9zq5cfYyhMhHUdMWf///zhBSQ8EFPrqLs332rJkEffEMQ1mPpDbr+KRBG3bg//3nf/6rVnWVQg/PHYzDPTGPR+oOwp/VErt2U8ocgpbYCDFtahkvDQaUQAAANX/9hiblxgNKy0bSRYWFqH76Nt/0IhOoz09PSzg2AoADx0JOg5HPlU3d0YpdSYmJhuJkfeq4jUlTwAAAOYMmYwAAAA7dFJOU/////////////////////////////////////////////////////////////////////////////8AocQ7HgAAAAlwSFlzAAAOwwAADsMBx2+oZAAAABl0RVh0U29mdHdhcmUAUGFpbnQuTkVUIDUuMS4xMYoIFs4AAAO7SURBVFhHpZQNU+JIEIYlhOCtxoV8EJf1MBA+BRR3Fffy/3/YvdPTM+lOpTiq7q3Cmcein2qaDjf1NbnuXZwen64o4JOjsR/0+WYT8snROAgH9nKVOgoivlHCgZJpHAKHdGN1ECmZRpiVOxxKVw/oZoA06NQ30tUHihG0MBz0RJ/oEmj7RARadRD1o1u6mfQJvayF4eCvb73BHRMmS8jzlcjqfnTfqCNCPwKN4fBbjOqhdQ89UqMKSR3cR/fBg3PfMPKsWhj2UDt0bfc80nwV2oLbh8aMNgmbrhWGgyFqh6Hr2iF3LZDVwUMgZk3YzFojqr2ZhkvYzNojf8zvwXd7ofSBYiVaeIf1cmY0Skg9mwh06lupbmEElHt95/fDpAeUe+2R1bUytzFSZrQt1S1E2/wZrlL35TwQZW6j33Gnvpzr3sVx07muaMTnVRnz6dQJnxyNaZLyzSbjk6Mxz3J7YXWSKpnGCXDCd5OskLICWPAdadCpR9KVAkWfCrOsznK82H4BrTp5/CHcI0I/X43ZNIvzIpv+/E8ktalNJ0/miqSMttGJR55JFo+LacGqwiMNQSHUSZL+iB9HafJEco2pwL/Bmakdz1BNco25wBzqZJQ+jlA7SScJZBoxCIEj01RejMf583Q6g0zjWOGYuh6lqE0mrmuJ6Nqj7Xo2Hef588x1LRFdezRdI4npybRMwaYR+lkzulnPnk2tBQyX0c26QbshT9hcZ8ZKEDYbohDf/gy1zn0Brbp+8vthkgLlXkvMftam0s7jIjq1aBrROAHKp9H3SCmA9vGjNMjqWpnbmMrPgEgzojHHN0hx6sv5X798l1PyyZnzeTlOveCTo7FaVHyr6+W8nq/wWjIjaz5bYfViI2Vb4JbviEQyL3cvwr3ed7utehEf4sZdEfohSLTm46twr/dv3W5So7Y8+b5LRh6CQms+Ll/ff/HE1/s4jjvdRm262mwO29/0n61HGkIL56vXI9wfn3CbwPx2fut0Q72Iy83hUFblF7k1Yhoe0ffL7sOYl5+rHbnX+/PbeX+Ozx3um3px2Jwq1G6rk5FpLBWWL7vV5+vxz/HP6oPc1ryO6S8bfUzXqN5ut6dTZbtWWAmkruFeHlcf/4iuu8121gf0VH5ZM4brkGetkNzezO5OM6nrxdeprOykkYqRt0/hvH5537HZbUj3pFld/64aM9aN0D+AErHXv9531nzVXsMtzBgC0D1+iETrFmbj7jQ7dS3NiEb6Bjnklma4+WzFqS+n9ctnv8HLqet/AeFM0AfYldt3AAAAAElFTkSuQmCC) no-repeat; background-size: calc(var(--rk) * 6) calc(var(--rk) * 3); image-rendering: pixelated; }
  .mini { width: 1.25rem; height: 1.25rem; flex: none; border-radius: 2px; image-rendering: pixelated; }
  .mini.opp { width: 1rem; height: 1rem; margin-right: .375rem; vertical-align: -.1875rem; }
  .si { display: inline-flex; flex: none; gap: .125rem; }
  .si img { width: 1rem; height: 1rem; image-rendering: pixelated; }
  .rot { display: inline-block; animation: rotIn .45s ease both; }

  /* last results as squares */
  .sqs { display: flex; gap: .25rem; }
  .sq { display: flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; border-radius: .25rem; font-size: .6875rem; font-weight: 600; text-shadow: none;
    background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .sq.win { color: var(--win); } .sq.loss { color: var(--loss); } .sq.draw { color: var(--muted); }

  /* ---------- clean (the base every style builds on) ---------- */
  .card { width: calc(var(--w) * 1rem / 16); padding: var(--sp-pad); }
  .sec { margin-top: var(--sp-sec); padding-top: var(--sp-sec); border-top: 1px solid var(--line); }

  .hd { display: flex; align-items: center; gap: var(--sp-in); }
  .av { width: 2.5rem; height: 2.5rem; flex: none; border-radius: calc(var(--radius) * .5); image-rendering: pixelated; }
  .who { flex: 1; min-width: 0; }
  .nm { display: flex; align-items: center; gap: .375rem; font-size: .9375rem; font-weight: 600; }
  .flag { height: .625rem; width: auto; flex: none; border-radius: 1px; }
  .sub { display: flex; align-items: center; gap: .3125rem; margin-top: .125rem; font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .tier { color: var(--tier); font-weight: 600; }
  .elo { flex: none; text-align: right; }
  .ev { font-size: 1.75rem; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
  .ev.up { animation: up 2.2s ease; } .ev.down { animation: down 2.2s ease; }
  .tl .ev, .sub .ev { font-size: inherit; line-height: inherit; letter-spacing: inherit; }
  .el { margin-top: .25rem; font-size: .6875rem; color: var(--muted); }
  .el b { font-weight: 600; }

  .prog { margin-top: var(--sp-sec); }
  .track { height: 2px; border-radius: 1px; background: var(--track); overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--tier); transition: width .8s ease; }
  .pm { display: flex; justify-content: space-between; gap: .75rem; margin-top: .375rem; font-size: .6875rem; color: var(--muted); }
  .pm b { color: var(--text); font-weight: 500; }

  .stats { display: grid; gap: .75rem .5rem; }
  .stat b { display: block; font-size: .9375rem; font-weight: 600; line-height: 1.2; white-space: nowrap; }
  .stat b small, .kv b small { font-size: .75em; font-weight: 500; color: var(--muted); }
  .stat span { display: block; margin-top: .125rem; font-size: .6875rem; color: var(--muted); white-space: nowrap; }

  .sess { display: flex; align-items: baseline; gap: .5rem; font-size: .75rem; color: var(--muted); user-select: none; }
  .sess .rec { margin-left: auto; }
  .sess .d { min-width: 2.25rem; text-align: right; font-size: .875rem; font-weight: 600; }

  .mh { display: flex; justify-content: space-between; margin-bottom: .375rem; font-size: .6875rem; color: var(--muted); }
  .ml { list-style: none; margin: 0; padding: 0; }
  .m { display: flex; align-items: center; gap: .625rem; min-height: 1.75rem; padding: .1875rem 0; }
  .r { width: .75rem; flex: none; font-size: .75rem; font-weight: 600; }
  .win .r { color: var(--win); } .loss .r { color: var(--loss); } .draw .r { color: var(--muted); }
  .op { flex: 1; min-width: 0; }
  .op em { margin-left: .375rem; font-size: .75rem; font-style: normal; color: var(--faint); }
  .op small { display: block; font-size: .6875rem; color: var(--muted); }
  .t { flex: none; font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .ff { margin-left: .25rem; font-size: .5625rem; font-weight: 500; letter-spacing: .02em; color: var(--faint); }
  .ago { flex: none; width: 1.75rem; text-align: right; font-size: .6875rem; color: var(--faint); }
  .c { flex: none; width: 2.25rem; text-align: right; font-weight: 600; }
  .empty { padding: .25rem 0; font-size: .75rem; color: var(--muted); }

  .bar { display: flex; align-items: flex-end; gap: var(--sp-bar); padding: .5rem 1rem .5rem .5rem; white-space: nowrap; }
  .bar .av, .bar .rk { align-self: center; }
  .bar .av { width: 2.25rem; height: 2.25rem; }
  .bar .who { flex: none; align-self: center; margin-left: calc(var(--sp-in) - var(--sp-bar)); }
  .bar .nm { font-size: .875rem; }
  .bar .sub { font-size: .6875rem; }
  .vr { flex: none; width: 1px; height: 1.75rem; align-self: center; background: var(--line); }
  .kv b { display: block; font-size: .9375rem; font-weight: 600; line-height: 1.2; }
  .kv b.big { font-size: 1.25rem; letter-spacing: -.02em; line-height: 1.05; }
  .kv span { display: block; margin-top: .125rem; font-size: .6875rem; color: var(--muted); }
  .kv b.form { display: flex; gap: .5rem; }
  .btrack { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--track); }
  .btrack i { display: block; height: 100%; background: var(--tier); transition: width .8s ease; }

  .compact { width: max-content; min-width: 14rem; padding: var(--sp-in); }
  .compact .av { width: 2.25rem; height: 2.25rem; }
  .compact .ev { font-size: 1.5rem; }

  .lh { display: flex; align-items: center; gap: .5rem; white-space: nowrap; }
  .tl { margin-top: .125rem; }
  .lh .nm { font-size: .875rem; }
  .lh .ls { margin-left: auto; font-size: .75rem; color: var(--muted); user-select: none; }
  .lh .ls b { margin-left: .25rem; font-size: .8125rem; font-weight: 600; }
  .list .sec { margin-top: var(--sp-in); padding-top: .5rem; }

  /* ---------- badge: the rank badge is the hero, no panel by default ---------- */
  .sb.card { display: flex; flex-direction: column; align-items: center; gap: var(--sp-sec); padding: var(--sp-pad); text-align: center; }
  .sb.card .hd { flex-direction: column; gap: .125rem; }
  .sb.card .hd > .rk { margin-bottom: .375rem; }
  .sb.card .nm { justify-content: center; font-size: 1.125rem; }
  .sb .tl { font-size: .8125rem; color: var(--muted); }
  .sb .tl b { font-weight: 500; color: var(--text); }
  .sb .meta { font-size: .6875rem; color: var(--muted); }
  .sb .prog { width: 100%; max-width: 10rem; margin: 0; }
  .sb .pm { justify-content: center; margin-top: .25rem; }
  .sb .kvs { display: flex; justify-content: center; gap: 1.25rem; }
  .sb .sess b { font-weight: 500; }
  .sb.card .sess { font-size: .75rem; }
  .sb.bar { align-items: center; }
  .sb.compact .who .tl, .sb.bar .who .tl { font-size: .75rem; }
  .sb .m .r { display: flex; align-items: center; justify-content: center; width: 1.125rem; height: 1.125rem; border-radius: .25rem; font-size: .625rem; text-shadow: none;
    background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .sb.list { text-align: left; }
  .sb.list { align-items: stretch; }
  .sb.list .sec { border-top: 0; margin-top: 0; padding-top: 0; }

  /* ---------- tooltip: a Minecraft item tooltip ---------- */
  .stt { line-height: 1.3; letter-spacing: 0; }
  .stt.bordered { box-shadow: none; }
  .stt.bordered::after { content: ''; position: absolute; inset: .125rem; border: .0625rem solid rgba(96,48,255,.45); pointer-events: none; }
  .stt.card { padding: var(--sp-pad); }
  .stt .nm { font-size: 1rem; font-weight: 500; color: var(--tier); }
  .stt .tl { font-size: .8125rem; color: var(--muted); }
  .stt .tl b { font-weight: 400; color: var(--text); }
  .stt .blk { margin-top: var(--sp-sec); }
  .stt .ln { display: flex; justify-content: space-between; gap: 1rem; font-size: .8125rem; color: var(--muted); }
  .stt .ln b { font-weight: 400; color: var(--text); }
  .stt .ln b.pos { color: var(--win); } .stt .ln b.neg { color: var(--loss); }
  .stt .m { min-height: 1.25rem; padding: 0; gap: .5rem; font-size: .8125rem; }
  .stt .m .r, .stt .c { font-weight: 400; }
  .stt .t { color: var(--muted); }
  .stt .op em, .stt .ff { color: var(--faint); }
  .stt .ff { font-size: .6875rem; font-weight: 400; }
  .stt .sec { border-top: 0; margin-top: var(--sp-sec); padding-top: 0; }
  .stt.bar { align-items: center; }
  .stt .kv b { font-weight: 400; }
  .stt .ev { font-weight: 500; }

  /* ---------- banner: broadcast graphics, tier-colored rules ---------- */
  .sbn.bordered { box-shadow: inset 0 .125rem 0 var(--tier); }
  .sbn.bordered.shadowed { box-shadow: inset 0 .125rem 0 var(--tier), 0 8px 24px rgba(0,0,0,.28); }
  .sbn.card, .sbn.compact { padding: 0; }
  .sbn .hd { align-items: stretch; gap: 0; }
  .sbn .tile { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; padding: var(--sp-pad); background: var(--tier-soft); }
  .sbn .tile small { font-size: .6875rem; font-weight: 600; color: var(--tier); white-space: nowrap; }
  .sbn .who { display: flex; flex-direction: column; justify-content: center; padding: var(--sp-pad); }
  .sbn .nm { font-size: 1.125rem; font-weight: 600; }
  .sbn .sub b { font-weight: 500; color: var(--text); }
  .sbn .lab { display: block; font-size: .6875rem; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .sbn .kv2 b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .sbn .kv2 b small { font-size: .75em; font-weight: 500; color: var(--muted); }
  .sbn .body { padding: 0 var(--sp-pad) var(--sp-pad); }
  .sbn .sec { margin-top: var(--sp-sec); padding-top: 0; border-top: 0; }
  .sbn .body > .sec:first-child { margin-top: var(--sp-sec); }
  .sbn .prog { margin-top: 0; }
  .sbn .track { height: 3px; }
  .sbn .stats { gap: .75rem; }
  .sbn.bar { align-items: stretch; padding: 0 1rem 0 0; }
  .sbn.bar .tile { flex-direction: row; gap: var(--sp-in); padding: .5rem var(--sp-in); }
  .sbn .te { display: flex; flex-direction: column; justify-content: center; min-width: 3.75rem; }
  .sbn .te small { font-size: .625rem; font-weight: 600; line-height: 1.2; color: var(--tier); white-space: nowrap; }
  .sbn .te .ev { font-size: 1.125rem; line-height: 1.2; letter-spacing: -.01em; }
  .sbn .te .track { margin-top: .3125rem; height: 3px; }
  .sbn.bar > .who { margin: 0; padding: 0; }
  .sbn.bar > .who .nm { font-size: 1.125rem; }
  .sbn.bar > .kv2, .sbn.bar > .vr, .sbn.bar > .sqs { align-self: center; }
  .sbn.compact .tile, .sbn.compact .who { padding: var(--sp-in); }
  .sbn.compact .elo { display: flex; flex-direction: column; justify-content: center; padding: var(--sp-in) var(--sp-in) var(--sp-in) 0; }
  .sbn .ev { font-weight: 600; }
  .sbn.list .tile { padding: .5rem var(--sp-in); }
  .sbn.list .who { flex-direction: row; align-items: center; gap: .5rem; padding: 0 var(--sp-pad); }
  .sbn.list .who .nm { font-size: 1rem; }
  .sbn.list .ls { margin-left: auto; font-size: .75rem; color: var(--muted); }
  .sbn.list .ls b { margin-left: .25rem; font-weight: 600; }
  .sbn.list .rows { padding: .5rem var(--sp-pad) var(--sp-in); }

  /* ---------- Minecraft styles: one text size, Minecraft's own colors, pixel frames ---------- */
  .mc { --mc-red: #ff5555; --mc-gold: #ffaa00; --mc-yellow: #ffff55; --mc-gray: #aaaaaa; --mc-aqua: #55ffff; --mc-purple: #ff55ff;
    font-size: 1rem; line-height: 1.125rem; letter-spacing: 0; }
  .mc, .mc * { font-weight: 400 !important; }
  .mc small, .mc .kv b small, .mc .stat b small, .mc .kv2 b small { font-size: inherit; color: var(--muted); }
  .mc .flag { height: .75rem; }
  .mc .mini { width: 1rem; height: 1rem; border-radius: 0; }
  .mc .tier { font-weight: 400; }
  .mc i.lt { font-style: normal; }
  .mc .nm, .mc .sub, .mc .el, .mc .pm, .mc .mh, .mc .sess, .mc .sess .d, .mc .stat b, .mc .stat span, .mc .lh .nm, .mc .lh .ls, .mc .lh .ls b { font-size: 1rem; line-height: 1.125rem; }
  .mc .pm span { white-space: nowrap; }
  .mc .ln { white-space: nowrap; }
  .mc .rk, .mc .mini, .mc .flag, .mc .si { vertical-align: -.1875rem; }
  .mc .si img { vertical-align: top; }
  .mc .ln .ev, .mc .bt .ev, .mc .btn .ev, .ssc .ev { font-size: inherit; line-height: inherit; letter-spacing: 0; }
  .mc .kv b, .mc .kv b.big { font-size: 1rem; line-height: 1.125rem; letter-spacing: 0; } .mc .kv span { font-size: 1rem; }
  .mc .gap { height: 1.125rem; }
  .mc .ml .m { min-height: 1.125rem; padding: 0; gap: .5rem; }
  .mc .r, .mc .c { font-weight: 400; }
  .mc .t, .mc .ago, .mc .ff { font-size: inherit; }
  .mc .ago { width: auto; }
  .mc .op em { font-size: inherit; }
  .mc .stale { border-radius: 0; }
  .mc .tk, .mc .tv { font-size: 1rem; } .mc .tc { font-size: 1.25rem; }
  .c-gold { color: var(--mc-gold); } .c-yellow { color: var(--mc-yellow); } .c-gray { color: var(--mc-gray); } .c-aqua { color: var(--mc-aqua); }
  /* Minecraft's text shadow: the same color at a quarter brightness, one pixel down-right */
  body.mc.tshadow .ov { text-shadow: .125rem .125rem 0 rgba(0,0,0,.7); }
  @supports (color: color-mix(in srgb, red, blue)) {
    body.mc.tshadow .ov, body.mc.tshadow .ov * { text-shadow: .125rem .125rem 0 color-mix(in srgb, currentColor 25%, #000); }
  }
  .mc.shadowed { box-shadow: none; filter: drop-shadow(0 .5rem 1rem rgba(0,0,0,.35)); }
  /* 2px pixel ring drawn outside the box, corners left out, like Minecraft's GUI frames */
  .mc { --ring: transparent; --rw: .125rem; }
  .mc.ringed { box-shadow: 0 calc(var(--rw) * -1) 0 0 var(--ring), 0 var(--rw) 0 0 var(--ring), calc(var(--rw) * -1) 0 0 0 var(--ring), var(--rw) 0 0 0 var(--ring), var(--inner, 0 0 transparent); }

  /* scoreboard: the sidebar, red scores on the right */
  .ssc.card, .ssc.compact, .ssc.list { width: max-content; min-width: 10rem; padding: 0 0 .125rem; }
  .ssc .hd { display: flex; justify-content: center; align-items: center; gap: .375rem; padding: .0625rem .375rem; background: rgba(0,0,0,.12); white-space: nowrap; }
  .ssc .ln { display: flex; justify-content: space-between; gap: 1.5rem; padding: 0 .375rem; }
  .ssc .ln b { color: var(--mc-red); }
  .ssc .ln b.pos { color: var(--win); } .ssc .ln b.neg { color: var(--loss); } .ssc .ln b.zero { color: var(--muted); }
  .ssc .ln i { font-style: normal; } .ssc i.win { color: var(--win); } .ssc i.loss { color: var(--loss); } .ssc i.draw { color: var(--muted); }
  .ssc .ln em { font-style: normal; color: var(--muted); }
  .ssc.bar { align-items: stretch; gap: 0; padding: 0; }
  .ssc.bar > * { display: flex; align-items: center; gap: .375rem; padding: .0625rem .5rem; }
  .ssc.bar b { color: var(--mc-red); } .ssc.bar b.pos { color: var(--win); } .ssc.bar b.neg { color: var(--loss); } .ssc.bar b.zero { color: var(--muted); }

  /* F3: the debug screen, a gray box behind every line */
  .sf3.ov { display: flex; flex-direction: column; align-items: flex-start; overflow: visible; background: none; border-radius: 0; }

  .sf3 .pt { white-space: nowrap; } .sf3 .pt + .pt { margin-left: 1rem; }
  .sf3 .u { text-decoration: underline; text-underline-offset: .1875rem; text-decoration-thickness: .125rem; }

  /* chat: messages over a translucent black box, newest at the bottom */

  .sch .ln { display: block; padding: 0 .25rem; white-space: normal; }
  .sch .ln .rk, .sch .ln .si, .sch .ln .mini, .sch .ln .flag { vertical-align: -.125rem; }
  .sch .ln .si img { vertical-align: top; }
  .sch .hd { display: block; }
  .sch.bar .ln, .sch.compact .ln { white-space: nowrap; }

  /* advancement: the toast that slides in at the top right */
  .sad { --ring: #000; --inner: inset 0 0 0 .125rem #5a5a5a; background-color: var(--bg); }
  .sad.card, .sad.list { padding: .625rem .75rem .75rem; }

  /* inventory: the light gray container GUI with sunken slots */
  .sin { --ring: #000; --inner: inset .125rem .125rem 0 #fff, inset -.125rem -.125rem 0 #555; background-color: var(--bg); }
  .sin.card, .sin.list { padding: .75rem; }

  .sin .stat span, .sin .kv span { color: #3f3f3f; font-size: 1rem; }
  .sin .kv b.pos { color: #55ff55; } .sin .kv b.neg { color: #ff5555; }
  .sin .nm, .sin .sub, .sin .el, .sin .pm, .sin .mh, .sin .sess { font-size: 1rem; }
  .sin .tier { color: var(--text); }
  .sin .ev { font-size: 1.5rem; line-height: 1.125; }
  .sin .sec { border-top: 0; margin-top: .625rem; padding-top: 0; }
  .sin .track, .sin .btrack { height: .5rem; border-radius: 0; background: #373737; box-shadow: inset 0 0 0 .125rem #8b8b8b; }
  .sin .btrack { left: .125rem; right: .125rem; bottom: .125rem; }
  .sin .vr { background: #8b8b8b; width: .125rem; }

  /* boss bar: the title over a notched bar, filled with your tier progress */
  .sbb { text-align: center; }
  .sbb .hd, .sxp .hd { display: block; }
  .sbb.card, .sbb.list { padding: .5rem .75rem .75rem; }
  .sbb.compact { min-width: 0; padding: .375rem .5rem .5rem; }
  .sbb.bar { display: block; padding: .375rem .5rem .5rem; }
  .sbb .bt { white-space: nowrap; }
  .bb { position: relative; height: .625rem; margin-top: .375rem; background: rgba(0,0,0,.55); box-shadow: inset 0 0 0 .125rem rgba(0,0,0,.6); }
  @supports (color: color-mix(in srgb, red, blue)) { .bb { background: color-mix(in srgb, var(--tier) 22%, #0a0a0a); } }
  .bb i { display: block; height: 100%; background: var(--tier); box-shadow: inset 0 .125rem 0 rgba(255,255,255,.35), inset 0 -.125rem 0 rgba(0,0,0,.3); transition: width .8s ease; }
  .bb::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - .125rem), rgba(0,0,0,.4) calc(10% - .125rem) 10%); }
  .sbb.compact .bb { width: 18rem; }
  .sbb .ln, .sxp .ln { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1rem; white-space: normal; color: var(--muted); }
  .sbb .ln > span, .sxp .ln > span { white-space: nowrap; }

  .sbb .lns { margin-top: .5rem; }

  /* XP: the elo as the green level number over the experience bar */
  .sxp { text-align: center; }
  .sxp.card, .sxp.list { padding: .5rem .75rem .75rem; }
  .sxp.compact { min-width: 0; padding: .25rem .5rem .5rem; }
  .sxp.bar { align-items: center; gap: 1.25rem; padding: .375rem 1rem .375rem .5rem; }
  .sxp .xt { white-space: nowrap; }
  .sxp .xl { display: flex; flex-direction: column; align-items: center; margin-top: .25rem; }
  .sxp .lv { position: relative; z-index: 1; margin-bottom: -.3125rem; font-size: 1.5rem; line-height: 1.5rem; color: #80ff20;
    text-shadow: .125rem 0 0 #000, -.125rem 0 0 #000, 0 .125rem 0 #000, 0 -.125rem 0 #000 !important; }
  .xb { position: relative; width: 100%; height: .625rem; background: #1c1c1c; box-shadow: inset 0 0 0 .125rem #000; }
  .xb i { display: block; height: 100%; background: #80ff20; box-shadow: inset 0 .125rem 0 #b8ff70, inset 0 -.125rem 0 #3f8a10, inset .125rem 0 0 #000; transition: width .8s ease; }
  .xb::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(5.555% - .125rem), rgba(0,0,0,.55) calc(5.555% - .125rem) 5.555%); }
  .sxp.compact .xl, .sxp.bar .xl { width: 18rem; }
  .sxp .ln b { color: var(--text); }
  .sxp .lns { margin-top: .5rem; }
  .sxp .ml { margin-top: .5rem; text-align: left; }
  .sxp.bar .who { margin: 0; text-align: left; }

  /* buttons: the menu, one stone button per line, the elo one hovered */
  .sbt.ov { display: flex; flex-direction: column; gap: .25rem; overflow: visible; background: none; border-radius: 0; }
  .sbt.card, .sbt.list { padding: .125rem; }
  .sbt.compact { width: calc(var(--w) * 1rem / 16); min-width: 0; padding: .125rem; }
  .sbt.bar { flex-direction: row; align-items: stretch; gap: .25rem; padding: .125rem; }
  .btn, .sbt .ml .m { position: relative; display: flex; align-items: center; justify-content: center; gap: .375rem; min-height: 2.25rem; padding: 0 .625rem; white-space: nowrap;
    background-color: var(--bg); background-image: var(--speckle), var(--fill, none); background-size: 2rem 2rem, 100% 100%; image-rendering: pixelated;
    box-shadow: inset .125rem .125rem 0 rgba(255,255,255,.28), inset -.125rem -.1875rem 0 rgba(0,0,0,.3), 0 0 0 .125rem #000; }
  .btn.hov { box-shadow: inset .125rem .125rem 0 rgba(255,255,255,.28), inset -.125rem -.1875rem 0 rgba(0,0,0,.3), 0 0 0 .125rem #fff; color: #ffffa0; }
  .btn.hov .ev { color: inherit; }
  .brow { display: flex; gap: .25rem; } .brow > .btn { flex: 1 1 0; min-width: 0; overflow: hidden; }
  .btn.sl { background-color: #1c1c1c; background-image: none; box-shadow: 0 0 0 .125rem #000, inset 0 0 0 .125rem #000; }
  .btn.sl .knob { position: absolute; top: 0; bottom: 0; width: 1rem; margin-left: -.5rem; background-color: var(--bg); background-image: var(--speckle); background-size: 2rem 2rem;
    box-shadow: inset .125rem .125rem 0 rgba(255,255,255,.28), inset -.125rem -.1875rem 0 rgba(0,0,0,.3), 0 0 0 .125rem #000; transition: left .8s ease; }
  .btn.sl span { position: relative; }
  .sbt .ml { display: flex; flex-direction: column; gap: .25rem; }
  .sbt .ml .m { justify-content: flex-start; min-height: 2rem; gap: .625rem; }
  .sbt .toast { background-color: var(--bg); background-image: var(--speckle); background-size: 2rem 2rem; box-shadow: inset 3px 0 0 var(--tc), 0 0 0 .125rem #000; }

  /* MCSR Ranked: a dark panel with a light pixel frame, green name and a green elo box, like the site's logo */
  .srk { --mg: #6fb23c; --ring: #c6c6c6; --rw: .1875rem; background-color: var(--bg); }
  .srk.card, .srk.list { padding: .875rem; }
  .srk.compact { padding: .625rem .625rem .625rem .75rem; }
  .srk .nm { color: var(--mg); text-transform: uppercase; font-size: 1rem; }
  .srk .sub, .srk .pm, .srk .mh, .srk .stat span, .srk .kv span, .srk .sess, .srk .el { font-size: 1rem; text-transform: uppercase; }
  .srk .hd > .elo, .srk .kv b.big { position: relative; padding: .375rem .5rem .3125rem; background: var(--mg); color: #0b1d20;
    box-shadow: 0 -.1875rem 0 0 #c6c6c6, 0 .1875rem 0 0 #c6c6c6, -.1875rem 0 0 0 #c6c6c6, .1875rem 0 0 0 #c6c6c6; }
  .srk .hd > .elo .ev { font-size: 1.5rem; line-height: 1.125; color: #0b1d20; }
  .srk .hd > .elo .el { color: #0b1d20; margin-top: .125rem; }
  .srk .hd > .elo .el b { color: #0b1d20; }
  .srk .kv b.big { font-size: 1.25rem; padding: .25rem .5rem; margin: .1875rem; }
  .srk .sec { border-top: .1875rem solid #27393b; }
  .srk .track { height: .375rem; border-radius: 0; background: #27393b; }
  .srk .stat b { font-size: 1rem; }

  /* ---------- live run: your splits from live/mcsr-live.py, graded against your past runs ---------- */
  :root { --best: #ffc94d; --great: #34e39a; --good: #9be36b; --okay: #b7c2d6; --slow: #ff9a4d; --live: #4fe3ff; }
  .mc, .stt { --best: #ffaa00; --great: #55ff55; --good: #aaff55; --okay: #aaaaaa; --slow: #ff5555; --live: #55ffff; }
  .gold { color: var(--best); font-style: normal; }
  .rh { display: flex; align-items: baseline; gap: .375rem; white-space: nowrap; }
  .rph { font-size: .6875rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .rtm { font-size: .9375rem; font-weight: 600; }
  .rd { align-self: center; padding: .0625rem .3125rem; border-radius: .25rem; font-size: .6875rem; font-weight: 700; font-style: normal; line-height: 1.3;
    color: var(--vc); background: color-mix(in srgb, var(--vc) 16%, transparent); text-shadow: none; }
  .rx, .rpb { margin-left: auto; padding-left: .75rem; font-size: .6875rem; color: var(--muted); }
  .rpb { font-weight: 600; color: var(--best); }
  /* the track: a dot per split, the gap ahead fills toward your average for the next one */
  .rt { display: flex; align-items: center; margin-top: .5rem; }
  body.tshadow .rt { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.6)); }
  .rs { flex: 1 1 0; height: 2px; margin: 0 .1875rem; border-radius: 1px; background: var(--track); overflow: hidden; }
  .rs i { display: block; width: 0; height: 100%; background: var(--live); transition: width .3s linear; }
  .rs[data-fill] i { width: calc(var(--rf, 0) * 100%); }
  .rs.done i { width: 100%; background: var(--faint); transition: none; }
  .rs.late i { background: var(--slow); }
  .rn { position: relative; flex: none; width: .5rem; height: .5rem; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .rn.fin { border-radius: 1px; transform: rotate(45deg); }
  .rn.hit { background: var(--vc); box-shadow: 0 0 .375rem color-mix(in srgb, var(--vc) 60%, transparent); }
  .rn.next { box-shadow: inset 0 0 0 1.5px var(--live); animation: breathe 2.4s ease-in-out infinite; }
  .rn.next.late { box-shadow: inset 0 0 0 1.5px var(--slow); animation: none; }
  .rn.pop { animation: pop .65s cubic-bezier(.3, 1.7, .5, 1); }
  .rn.fin.pop { animation-name: popFin; }
  @keyframes breathe { 50% { box-shadow: inset 0 0 0 1.5px var(--live), 0 0 .5rem color-mix(in srgb, var(--live) 60%, transparent); } }
  @keyframes pop { 0% { transform: scale(.2); } }
  @keyframes popFin { 0% { transform: rotate(45deg) scale(.2); } }
  .compact .run { margin-top: .5rem; }
  .compact .run .rt { margin-top: .375rem; }
  /* a run never makes Compact wider (the OBS source stays put); what doesn't fit wraps */
  .compact .run, .compact .rbb { width: 0; min-width: 100%; }
  .compact .rh { flex-wrap: wrap; }
  .compact .rbb .bt { white-space: normal; }
  .bar .krun b { display: flex; align-items: center; gap: .375rem; }
  .bar > .rt { flex: none; width: 8rem; margin: 0; align-self: center; }
  .sbn.bar > .krun { align-self: center; }
  .sb.card:not(.list) .run { width: 100%; max-width: 15rem; }
  .sb.card:not(.list) .rh { justify-content: center; flex-wrap: wrap; }
  .sb.card:not(.list) .rx, .sb.card:not(.list) .rpb { width: 100%; margin: .125rem 0 0; padding: 0; text-align: center; }
  .sbn.compact .body { padding: 0 var(--sp-in) var(--sp-in); }
  .sbn .body > .run:first-child { margin-top: var(--sp-in); }
  /* PB pace: a gold light runs around the panel; the framed Minecraft styles turn their frame gold */
  @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .ov.pbpace:not(.mc)::before { content: ''; position: absolute; inset: 0; z-index: 3; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--ang), transparent 0 62%, color-mix(in srgb, var(--best) 15%, transparent) 72%, var(--best) 86%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 3.2s linear infinite; }
  body.nopanel .ov.pbpace::before { display: none; }
  @keyframes spin { to { --ang: 360deg; } }
  .mc.ringed.pbpace { --ring: var(--best); }
  /* Minecraft: plain colored text, a pixel track */
  .mc .rh { flex-wrap: wrap; }
  .mc .rph { font-size: 1rem; letter-spacing: 0; text-transform: none; }
  .mc .rtm, .mc .rx, .mc .rpb { font-size: 1rem; }
  .mc .rd, .stt .rd { padding: 0; border-radius: 0; background: none; font-size: inherit; line-height: inherit; }
  .mc .rt, .stt .rt { margin-top: .375rem; }
  .mc .rs, .stt .rs { height: .25rem; margin: 0; border-radius: 0; background: rgba(0,0,0,.5); }
  .mc .rs.done i, .stt .rs.done i { background: var(--muted); }
  .mc .rn, .stt .rn { width: .625rem; height: .625rem; border-radius: 0; box-shadow: inset 0 0 0 .125rem var(--muted); }
  .mc .rn.fin, .stt .rn.fin { transform: none; }
  .mc .rn.fin.pop, .stt .rn.fin.pop { animation-name: pop; }
  .mc .rn.hit, .stt .rn.hit { box-shadow: inset 0 0 0 .125rem rgba(0,0,0,.3); }
  .mc .rn.next, .stt .rn.next { box-shadow: inset 0 0 0 .125rem var(--live); animation: blink 1s steps(1) infinite; }
  .mc .rn.next.late, .stt .rn.next.late { box-shadow: inset 0 0 0 .125rem var(--slow); animation: none; }
  @keyframes blink { 50% { box-shadow: inset 0 0 0 .125rem transparent; } }
  .sad .rs { background: #000; }
  .srk .rph { text-transform: uppercase; }
  .srk .rs { height: .375rem; background: #27393b; }
  /* inventory: the run sits in a sunken slot, white text like the stats */
  .sin .run { padding: .375rem .5rem .5rem; background: #8b8b8b; box-shadow: inset .125rem .125rem 0 #373737, inset -.125rem -.125rem 0 #fff; }
  .sin .run .rph { color: #3f3f3f; }
  .sin .run .rtm, .sin .run .rx { color: #fff; }
  .sin .run .rtm, .sin .run .rx, .sin .run .rd, .sin .run .rpb { text-shadow: .125rem .125rem 0 #3f3f3f; }
  .sin .run .rs { background: #373737; }
  /* boss bar: a second bar under the first, filling toward your next split */
  .rbb { margin-top: .5rem; }
  .rbb .bt { white-space: nowrap; }
  .bb.live { background: rgba(0,0,0,.55); }
  @supports (color: color-mix(in srgb, red, blue)) { .bb.live { background: color-mix(in srgb, var(--live) 22%, #0a0a0a); } }
  .bb.live i { width: calc(var(--rf, 0) * 100%); background: var(--live); transition: width .3s linear; }
  .bb.live.late i { background: var(--slow); }
  .sxp .run { margin-top: .5rem; }
  .sxp .run .ln { justify-content: space-between; }
  /* buttons: the run's own buttons, and a slider that slides toward your next split */
  .btn.gold { color: var(--best); }
  .rrow > .btn:first-child { flex: none; }
  .sbt.bar .btn.sl.run { min-width: 14rem; }
  .btn.sl.run .knob { left: calc(.5rem + (100% - 1rem) * var(--rf, 0)); transition: left .3s linear; }
  .btn.sl.run.late .knob { box-shadow: inset .125rem .125rem 0 rgba(255,255,255,.28), inset -.125rem -.1875rem 0 rgba(0,0,0,.3), 0 0 0 .125rem var(--slow); }

  /* messages */
  .msg .mt { font-size: .875rem; font-weight: 600; }
  .msg .mb { margin-top: .25rem; font-size: .75rem; line-height: 1.45; color: var(--muted); white-space: normal; }
  .bar.msg { display: block; padding: .75rem 1rem; }
  .msg code { font-family: Consolas, ui-monospace, monospace; color: var(--text); }
  .stale { position: absolute; top: .5rem; right: .5rem; width: 5px; height: 5px; border-radius: 50%; background: var(--loss); opacity: .7; }

  /* new-match popup */
  .toast { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center; gap: .75rem; padding: 0 1rem; box-shadow: inset 3px 0 0 var(--tc); }
  .bar .toast { bottom: 0; }
  .hd, .lh, .bar > * { transition: opacity .2s ease; }
  .toasting .hd, .toasting .lh, .bar.toasting > :not(.toast) { opacity: 0; }
  .toast.win { --tc: var(--win); } .toast.loss { --tc: var(--loss); } .toast.draw { --tc: var(--muted); }
  .toast.gold { background-image: linear-gradient(100deg, color-mix(in srgb, var(--best) 22%, transparent), transparent 65%); }
  .toast.enter { animation: tin .3s cubic-bezier(.2,.7,.2,1) both; }
  .toast.leave { animation: tout .3s ease-in both; }
  .tk { font-size: .9375rem; font-weight: 700; color: var(--tc); }
  .tv { flex: 1; min-width: 0; font-size: .8125rem; color: var(--muted); }
  .tv b { font-weight: 500; color: var(--text); }
  .tc { font-size: 1.25rem; font-weight: 700; color: var(--tc); }

  @keyframes tin { from { transform: translateY(-100%); } }
  @keyframes tout { to { transform: translateY(-100%); } }
  @keyframes rotIn { from { opacity: 0; transform: translateY(.25rem); } }
  @keyframes up { 0%, 45% { color: var(--win); } }
  @keyframes down { 0%, 45% { color: var(--loss); } }
</style>

<body>
<div id="root"></div>
<div id="ghost" aria-hidden="true"></div>
<script src="live.js"></script>
<script>
(() => {
  'use strict';

  const API = 'https://api.mcsrranked.com';
  const MATCH_FETCH = 50; // enough history to compute the session

  // Every option is a URL param: overlay.html?u=orq2&style=tooltip&layout=bar (also read after a #)
  const DEFAULTS = {
    u: '',
    style: 'badge', layout: 'card', stats: 'season', align: 'left', valign: 'top',
    avatar: false, flag: true, tier: true, rank: true, progress: true, peak: true,
    pb: true, avg: false, wl: true, wr: true, streak: false, ff: false, played: false,
    session: true, sesstime: false, sessstreak: false, reset: 4,
    matches: 5, oppelo: true, heads: false, seed: false, ago: false, popup: true,
    label: '', goal: '', rotate: 0,
    accent: '', muted: '', edge: '', fill: 'solid', texture: 'none',
    font: 'rubik', bg: '000000', bga: 0, text: 'ffffff', win: '4ade80', loss: 'f87171',
    scale: 100, width: 320, radius: 8, border: false, shadow: false, tshadow: true,
    refresh: 30,
    run: false, runpop: true,
  };

  // Each style brings its own look; any of these can still be overridden by a URL param.
  const STYLE_THEMES = {
